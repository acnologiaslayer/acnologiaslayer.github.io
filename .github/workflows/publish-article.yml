name: Publish article

# Generates a new article twice a week in Mahir Musleh's voice, commits it,
# then builds and deploys the site in the same job.
#
# Note: a commit pushed with the default GITHUB_TOKEN does NOT trigger other
# workflows (GitHub's loop protection), so this job deploys directly instead
# of relying on the separate Deploy workflow.
#
# AI provider: the generator tries a configured key-based provider first
# (Anthropic/OpenAI), then Gemini, then a free no-auth provider. If none
# produces a valid article, the run skips cleanly instead of failing.
# Add ANTHROPIC_API_KEY, OPENAI_API_KEY, or GEMINI_API_KEY as a repo secret.

on:
  schedule:
    # 09:00 UTC every Tuesday and Friday
    - cron: "0 9 * * 2,5"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Print the article instead of committing"
        required: false
        default: "false"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Generate article
        id: generate
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DRY_RUN: ${{ github.event.inputs.dry_run == 'true' && '1' || '' }}
        run: npm run generate-article

      - name: Commit new article
        id: commit
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          if [ -n "$(git status --porcelain src/content/articles)" ]; then
            git config user.name "Mahir Musleh"
            git config user.email "arc.mahir@gmail.com"
            git add src/content/articles
            NEW_FILE=$(git diff --cached --name-only --diff-filter=A | head -1)
            git commit -m "Publish article: ${NEW_FILE##*/}"
            git push
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "Published $NEW_FILE"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
            echo "No new article to publish."
          fi

      # Build and deploy in the same run (the commit above cannot trigger the
      # separate Deploy workflow due to GITHUB_TOKEN loop protection).
      - name: Build site
        if: ${{ steps.commit.outputs.published == 'true' }}
        run: npm run build
      - name: Configure Pages
        if: ${{ steps.commit.outputs.published == 'true' }}
        uses: actions/configure-pages@v5
      - name: Upload artifact
        if: ${{ steps.commit.outputs.published == 'true' }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy to Pages
        id: deployment
        if: ${{ steps.commit.outputs.published == 'true' }}
        uses: actions/deploy-pages@v4
